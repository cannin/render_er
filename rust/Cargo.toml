[package]
name = "render_er"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "SBGN Entity Relationship Level 1 renderer"

[dependencies]
ahash = { version = "=0.8.11", default-features = false }
anyhow = "1.0"
base64 = "0.22.1"
fontdue = "0.8"
resvg = "0.48.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }
xmltree = "0.10"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
